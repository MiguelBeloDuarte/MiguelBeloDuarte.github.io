<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja Online</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Loja</h1>

      <nav>
        <ul>
          <li><a href="#produtos">Produtos</a></li>
          <li><a href="#cesto">Cesto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="produtos">
        <h2>Selecione os seus Produtos</h2>

        <div class="filtros">
          <p>
            Filtrar
            <select id="filtro-categoria">
              <option value="">Todas as categorias</option>
            </select>
          </p>

          <p>
            Ordenar
            <select id="ordenar-preco">
              <option value="">Ordenar pelo preço</option>
              <option value="desc">Preço Decrescente</option>
              <option value="asc">Preço Crescente</option>
            </select>
          </p>

          <p>
            Procurar
            <input
              type="text"
              id="pesquisa"
              placeholder="pesquise por produto"
            />
          </p>
        </div>

        <div id="lista-produtos" class="lista"></div>
      </section>

      <section id="cesto">
        <h2>Produtos Selecionados</h2>
        <div id="lista-cesto" class="lista"></div>
        <p id="custo-total">Custo total: 0 €</p>

        <form id="checkout">
          <p>
            És estudante do DEISI?
            <select id="estudante">
              <option value="nao">Não</option>
              <option value="sim">Sim</option>
            </select>
          </p>

          <p>
            Cupão de desconto:
            <input type="text" id="cupao" />
          </p>

          <button type="submit">Comprar</button>

          <div id="resultado-compra"></div>
        </form>
      </section>
    </main>

    <footer><p>2026</p></footer>
    <script src="main.js"></script>
  </body>
</html>
